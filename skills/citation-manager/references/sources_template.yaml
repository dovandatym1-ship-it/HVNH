    author: "Trần Thị B"
    year: 2022
    title: "Ứng dụng học máy trong dự báo rời bỏ khách hàng"
    journal: "Tạp chí Ngân hàng"
    volume: 15
    issue: 3
    pages: "45-58"

  - id: chen-2016-xgboost
    type: article
    language: en
    author: "Chen, T."
    year: 2016
    title: "XGBoost: A Scalable Tree Boosting System"
    journal: "Proceedings of KDD"
    volume: 22
    issue: 1
    pages: "785-794"

  - id: reichheld-2000-loyalty

    type: book
    language: vi
    author: "Nguyễn Văn A"
    year: 2023
    title: "Học máy ứng dụng trong quản trị rủi ro ngân hàng"
    publisher: "NXB Khoa học Kỹ thuật"
    place: "Hà Nội"

  - id: tran-thi-b-2022-baibaonganhang
    type: article

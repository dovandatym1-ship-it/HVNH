# Mẫu khai báo danh mục Tài liệu tham khảo (TLTK) chuẩn HVNH cho citation_manager.py
#
# Mỗi nguồn cần: id (định danh nội bộ duy nhất, dùng để bạn nhớ, KHÔNG phải số [n] —
# số [n] được assign_numbers() tự tính theo thứ tự ABC/ngôn ngữ), type ('book' hoặc
# 'article'), language ('vi' hoặc 'en'), author, year, title, và các trường riêng
# theo type bên dưới.
#
# type: book    -> cần thêm: publisher, place
# type: article -> cần thêm: journal, volume, issue, pages
#
# author:
#   - Nguồn tiếng Việt (language: vi): ghi tên tác giả theo trật tự thông thường,
#     ví dụ "Nguyễn Văn A" — chương trình sẽ tự lấy TÊN (từ cuối cùng) để xếp ABC.
#   - Nguồn nước ngoài (language: en): nên ghi dạng "Họ, Tên viết tắt" ví dụ
#     "Chen, T." để chương trình xếp ABC đúng theo HỌ; nếu ghi "Chen T." (không
#     dấu phẩy) chương trình sẽ lấy từ đầu tiên làm họ, có thể sai nếu tên có nhiều từ.

sources:

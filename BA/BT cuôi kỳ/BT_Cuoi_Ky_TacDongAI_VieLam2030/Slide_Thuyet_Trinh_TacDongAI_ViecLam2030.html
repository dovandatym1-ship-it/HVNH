<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tác động của AI đến Việc làm năm 2030 — Slide thuyết trình</title>
<style>
  :root{
    --navy:#0A2540; --orange:#EA580C; --gold:#F59E0B; --cyan:#0284C7;
    --red:#DC2626; --green:#10B981; --canvas:#F8FAFC; --card:#FFFFFF;
    --border:#E2E8F0; --text:#0F172A; --muted:#64748B;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Calibri,Arial,sans-serif;background:#1e293b;color:var(--text);}
  .deck{max-width:1280px;margin:0 auto;padding:24px 0 80px;}
  .slide{
    background:var(--canvas); width:100%; aspect-ratio:16/9; margin:0 auto 28px;
    border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.35); padding:38px 46px;
    display:none; flex-direction:column; position:relative; overflow:hidden;
  }
  .slide.active{display:flex;}
  .slide.cover{background:var(--navy); color:#fff; justify-content:center;}
  .tag{
    display:inline-block; background:var(--navy); color:#fff; font-size:11px; font-weight:700;
    letter-spacing:.04em; padding:5px 14px; border-radius:14px; margin-bottom:10px; width:fit-content;
  }
  .slide.cover .tag{background:var(--gold); color:var(--navy);}
  h1.title{font-size:26px; color:var(--navy); margin:0 0 18px; line-height:1.25;}
  .slide.cover h1.title{color:#fff; font-size:38px; text-align:left; max-width:90%;}
  .pagenum{position:absolute; top:24px; right:32px; font-size:12px; color:var(--muted); font-weight:700;}
  .bullets{font-size:16px; line-height:1.7;}
  .bullets li{margin-bottom:12px;}
  .bullets b{color:var(--orange);}
  .cards{display:flex; gap:16px; margin-top:6px; flex:1;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px;
    flex:1; display:flex; flex-direction:column;
  }
  .card .kpi{font-size:28px; font-weight:800; margin-bottom:4px;}
  .card .lbl{font-size:12px; font-weight:700; color:var(--navy); margin-bottom:8px;}
  .card ul{font-size:11px; color:var(--text); padding-left:16px; margin:0;}
  .chart-row{display:flex; gap:18px; flex:1; min-height:0;}
  .chart-img{flex:0 0 58%; border:1px solid var(--border); border-radius:8px; background:#fff;
    display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .chart-img img{max-width:100%; max-height:100%; object-fit:contain;}
  .notes-panel{flex:1; background:#fff; border:1px solid var(--border); border-radius:8px; padding:14px 16px; overflow:auto;}
  .notes-panel h3{margin:0 0 8px; font-size:13px; color:var(--navy);}
  .notes-panel .item{margin-bottom:10px; font-size:12px;}
  .notes-panel .item b{color:var(--orange);}
  .persona-row, .model-row{display:flex; gap:14px; flex:1;}
  .persona{background:#fff; border:1px solid var(--border); border-radius:8px; flex:1; overflow:hidden; display:flex; flex-direction:column;}
  .persona .hdr{background:var(--navy); color:#fff; padding:10px; text-align:center; font-weight:700; font-size:13px;}
  .persona .body{padding:12px; font-size:12px;}
  .persona .body .lbl{color:var(--orange); font-weight:700; margin-top:8px;}
  .model{background:#fff; border:1.5px solid var(--border); border-radius:8px; flex:1; padding:14px; position:relative;}
  .model.winner{border-color:var(--orange); border-width:2.5px;}
  .model .winner-badge{position:absolute; top:-12px; left:14px; background:var(--orange); color:#fff;
    font-size:10px; font-weight:800; padding:3px 10px; border-radius:8px;}
  .model .name{font-weight:800; color:var(--navy); font-size:15px; margin-bottom:8px;}
  .model.winner .name{color:var(--orange);}
  .model .m-val{font-size:18px; font-weight:800; margin-top:8px;}
  .model .m-lbl{font-size:10px; color:var(--muted);}
  .pipeline-row{display:flex; gap:12px; flex:1;}
  .pstep{background:#fff; border:1px solid var(--border); border-radius:8px; flex:1; padding:12px;}
  .pstep .badge{display:inline-block; background:var(--navy); color:#fff; font-weight:800; font-size:12px; padding:5px 10px; border-radius:6px; margin-bottom:8px;}
  .pstep.first .badge{background:var(--orange);}
  .pstep .t{font-weight:700; color:var(--navy); font-size:12px; margin-bottom:6px;}
  .pstep ul{font-size:10.5px; padding-left:14px; margin:0;}
  .tier-row{display:flex; gap:10px; align-items:stretch; flex:1; margin-bottom:8px;}
  .tier-label{background:var(--navy); color:#fff; border-radius:8px; display:flex; align-items:center;
    justify-content:center; text-align:center; font-weight:700; font-size:12px; padding:8px; flex:0 0 22%;}
  .tier-desc{background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px; font-size:11.5px; flex:0 0 55%; display:flex; align-items:center;}
  .tier-kpi{background:var(--canvas); border:1px solid var(--border); border-radius:8px; padding:10px; font-size:11px; font-weight:700; flex:1; display:flex; align-items:center; justify-content:center; text-align:center;}
  .tiers{display:flex; flex-direction:column; flex:1; justify-content:space-between;}
  .speaker-toggle{position:fixed; bottom:70px; right:24px; background:#334155; color:#fff; border:none;
    border-radius:6px; padding:8px 14px; cursor:pointer; font-size:12px; z-index:20;}
  .speaker-box{display:none; position:fixed; bottom:110px; right:24px; width:360px; max-height:300px; overflow:auto;
    background:#fff; border-radius:8px; padding:14px; font-size:12.5px; line-height:1.6; box-shadow:0 6px 20px rgba(0,0,0,.3); z-index:20;}
  .speaker-box.show{display:block;}
  .nav{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:10px; align-items:center; z-index:20;}
  .nav button{background:var(--navy); color:#fff; border:none; border-radius:6px; padding:10px 16px; cursor:pointer; font-size:14px;}
  .nav button:hover{background:var(--orange);}
  .nav .counter{color:#fff; font-size:13px; font-weight:600; min-width:60px; text-align:center;}
  .footer-meta{margin-top:auto; font-size:11px; color:var(--muted);}
</style>
</head>
<body>
<div class="deck" id="deck"></div>

<button class="speaker-toggle" onclick="document.getElementById('spk').classList.toggle('show')">💬 Speaker Notes</button>
<div class="speaker-box" id="spk"></div>
<div class="nav">
  <button onclick="go(-1)">◀ Trước</button>
  <span class="counter"><span id="cur">1</span> / <span id="tot">18</span></span>
  <button onclick="go(1)">Sau ▶</button>
</div>

const deck = document.getElementById('deck');
SLIDES.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide' + (i===0 ? ' active' : '') + (s.cover ? ' cover' : '');
  let html = '';
  if (!s.cover) {
    html += `<div class="pagenum">${String(i+1).padStart(2,'0')} / ${SLIDES.length}</div>`;
    if (s.tag) html += `<div class="tag">${s.tag}</div>`;
    html += `<h1 class="title">${s.title}</h1>`;
  } else {
    html += `<div class="tag">${s.tag||'HỌC VIỆN NGÂN HÀNG'}</div><h1 class="title">${s.title}</h1><div style="font-size:16px;color:#cbd5e1;margin-top:10px;">${s.sub||''}</div>`;
  }
  if (s.cards) {
    html += '<div class="cards">' + s.cards.map(c => `
      <div class="card"><div class="kpi" style="color:${c.color}">${c.kpi}</div><div class="lbl">${c.lbl}</div>
      <ul>${c.items.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('') + '</div>';
  }
  if (s.bullets) {
    html += '<ul class="bullets">' + s.bullets.map(([lead,rest]) => `<li><b>${lead}:</b> ${rest}</li>`).join('') + '</ul>';
  }
  if (s.pipeline) {
    html += '<div class="pipeline-row">' + s.pipeline.map((p,idx) => `
      <div class="pstep ${idx===0?'first':''}"><span class="badge">${p.n}</span><div class="t">${p.t}</div>
      <ul>${p.items.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('') + '</div>';
  }
  if (s.chart) {
    html += `<div class="chart-row"><div class="chart-img"><img src="${s.chart}" alt="${s.title}"></div>
      <div class="notes-panel"><h3>Đọc biểu đồ</h3>${s.notesList.map(([t,d])=>`<div class="item"><b>${t}:</b> ${d}</div>`).join('')}</div></div>`;
  }
  if (s.models) {
    html += '<div class="model-row">' + s.models.map(m => `
      <div class="model ${m.winner?'winner':''}">${m.winner?'<div class="winner-badge">★ WINNER</div>':''}
      <div class="name">${m.name}</div>
      ${m.metrics.map(([l,v])=>`<div class="m-val">${v}</div><div class="m-lbl">${l}</div>`).join('')}</div>`).join('') + '</div>';
  }
  if (s.personas) {
    html += '<div class="persona-row">' + s.personas.map((p,idx) => `
      <div class="persona"><div class="hdr" style="background:${idx===0?'var(--orange)':'var(--navy)'}">${p.name}<br>${p.share}</div>
      <div class="body"><div class="lbl">🔍 Đặc trưng:</div>${p.features}
      <div class="lbl" style="color:var(--orange)">🎯 Hành động:</div>${p.action}</div></div>`).join('') + '</div>';
  }
  if (s.tiers) {
    html += '<div class="tiers">' + s.tiers.map(t => `
      <div class="tier-row"><div class="tier-label">${t.label}</div><div class="tier-desc">${t.desc}</div>
      <div class="tier-kpi">${t.kpi}</div></div>`).join('') + '</div>';
  }
  el.innerHTML = html;
  deck.appendChild(el);
});

let idx = 0;
function render() {
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active', i===idx));
  document.getElementById('cur').textContent = idx+1;
  document.getElementById('spk').innerHTML = '<b>Speaker Notes:</b><br>' + SLIDES[idx].notes;
}
function go(d){ idx = Math.max(0, Math.min(SLIDES.length-1, idx+d)); render(); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' ') go(1);
  if(e.key==='ArrowLeft') go(-1);
});
render();
</script>

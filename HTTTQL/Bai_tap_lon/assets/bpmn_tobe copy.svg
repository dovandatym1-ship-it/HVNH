<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" font-family="Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1F2937"/>
    </marker>
    <marker id="msg" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7030A0"/>
    </marker>
  </defs>

  <text x="800" y="32" font-size="21" font-weight="bold" text-anchor="middle" fill="#1F2937">Sơ đồ BPMN To-be: Cải tiến giai đoạn tiếp nhận - tư vấn - lập hồ sơ FTTH</text>
  <text x="800" y="54" font-size="13" text-anchor="middle" fill="#4B5563">Phạm vi đề xuất: GenAI + RAG + OCR/eKYC. Các khâu khảo sát - lắp đặt - mở cước giữ như As-is.</text>

  <!-- ===== POOL: VNPT ===== -->
  <rect x="20" y="76" width="1560" height="560" fill="none" stroke="#1F2937" stroke-width="2"/>
  <rect x="20" y="76" width="30" height="560" fill="#1F4E79"/>
  <text x="35" y="356" font-size="14" font-weight="bold" fill="white" text-anchor="middle" transform="rotate(-90 35 356)">TẬP ĐOÀN VNPT</text>

  <!-- Lane: CSKH / GenAI -->
  <rect x="50" y="76" width="1530" height="150" fill="none" stroke="#1F2937"/>
  <rect x="50" y="76" width="40" height="150" fill="#DBEAFE"/>
  <text x="70" y="151" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle" transform="rotate(-90 70 151)">Chatbot GenAI</text>

  <!-- Lane: Kinh doanh -->
  <rect x="50" y="226" width="1530" height="120" fill="none" stroke="#1F2937"/>
  <rect x="50" y="226" width="40" height="120" fill="#DCFCE7"/>
  <text x="70" y="286" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle" transform="rotate(-90 70 286)">Kinh doanh</text>

  <!-- Lane: Kỹ thuật (giữ as-is) -->
  <rect x="50" y="346" width="1530" height="130" fill="none" stroke="#1F2937"/>
  <rect x="50" y="346" width="40" height="130" fill="#FEF3C7"/>
  <text x="70" y="411" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle" transform="rotate(-90 70 411)">Kỹ thuật (giữ nguyên)</text>

  <!-- Lane: Billing (giữ as-is) -->
  <rect x="50" y="476" width="1530" height="160" fill="none" stroke="#1F2937"/>
  <rect x="50" y="476" width="40" height="160" fill="#FCE7F3"/>
  <text x="70" y="556" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle" transform="rotate(-90 70 556)">Billing (giữ nguyên)</text>

  <!-- ===== POOL KH ===== -->
  <rect x="20" y="656" width="1560" height="150" fill="none" stroke="#7030A0" stroke-width="2"/>
  <rect x="20" y="656" width="30" height="150" fill="#7030A0"/>
  <text x="35" y="731" font-size="14" font-weight="bold" fill="white" text-anchor="middle" transform="rotate(-90 35 731)">KHÁCH HÀNG</text>

  <!-- Customer -->
  <circle cx="130" cy="725" r="17" fill="#FFFFFF" stroke="#059669" stroke-width="3"/>
  <text x="130" y="762" font-size="10" text-anchor="middle">Phát sinh</text>
  <text x="130" y="774" font-size="10" text-anchor="middle">nhu cầu</text>

  <rect x="175" y="700" width="125" height="50" fill="#FFFFFF" stroke="#7030A0" stroke-width="1.5" rx="6"/>
  <text x="237" y="720" font-size="10" font-weight="bold" text-anchor="middle">Chat trên Web/</text>
  <text x="237" y="734" font-size="10" text-anchor="middle">Zalo/My VNPT</text>

  <rect x="560" y="700" width="125" height="50" fill="#FFFFFF" stroke="#7030A0" stroke-width="1.5" rx="6"/>
  <text x="622" y="720" font-size="10" font-weight="bold" text-anchor="middle">Chụp CCCD,</text>
  <text x="622" y="734" font-size="10" text-anchor="middle">xác nhận gói</text>

  <rect x="1000" y="700" width="125" height="50" fill="#FFFFFF" stroke="#7030A0" stroke-width="1.5" rx="6"/>
  <text x="1062" y="720" font-size="10" font-weight="bold" text-anchor="middle">Ký hợp đồng</text>
  <text x="1062" y="734" font-size="10" text-anchor="middle">điện tử (eSign)</text>

  <circle cx="1500" cy="725" r="17" fill="#FFFFFF" stroke="#DC2626" stroke-width="4"/>
  <text x="1500" y="762" font-size="10" text-anchor="middle">Đã dùng</text>
  <text x="1500" y="774" font-size="10" text-anchor="middle">dịch vụ</text>

  <!-- ===== CHATBOT LANE (in scope - green AI) ===== -->
  <circle cx="130" cy="150" r="17" fill="#FFFFFF" stroke="#059669" stroke-width="3"/>
  <text x="130" y="190" font-size="10" text-anchor="middle">Bot tiếp nhận</text>

  <!-- AI Task 1: GenAI hiểu nhu cầu -->
  <rect x="175" y="125" width="135" height="52" fill="#D1FAE5" stroke="#047857" stroke-width="2" rx="6"/>
  <text x="242" y="144" font-size="9.5" font-weight="bold" text-anchor="middle">[AI-1] GenAI hỏi &amp;</text>
  <text x="242" y="158" font-size="9.5" text-anchor="middle">hiểu nhu cầu KH</text>
  <text x="242" y="172" font-size="9.5" text-anchor="middle">(ngôn ngữ tự nhiên)</text>

  <!-- AI Task 2: RAG tra cứu catalog -->
  <rect x="335" y="125" width="135" height="52" fill="#D1FAE5" stroke="#047857" stroke-width="2" rx="6"/>
  <text x="402" y="144" font-size="9.5" font-weight="bold" text-anchor="middle">[AI-2] RAG tra cứu</text>
  <text x="402" y="158" font-size="9.5" text-anchor="middle">Product Catalog,</text>
  <text x="402" y="172" font-size="9.5" text-anchor="middle">tư vấn gói cước</text>

  <!-- AI Task 3: OCR/eKYC -->
  <rect x="560" y="125" width="135" height="52" fill="#D1FAE5" stroke="#047857" stroke-width="2" rx="6"/>
  <text x="627" y="144" font-size="9.5" font-weight="bold" text-anchor="middle">[AI-3] OCR + eKYC</text>
  <text x="627" y="158" font-size="9.5" text-anchor="middle">đọc CCCD, xác</text>
  <text x="627" y="172" font-size="9.5" text-anchor="middle">thực thông tin KH</text>

  <!-- AI Task 4: tạo hồ sơ sơ bộ -->
  <rect x="720" y="125" width="135" height="52" fill="#D1FAE5" stroke="#047857" stroke-width="2" rx="6"/>
  <text x="787" y="144" font-size="9.5" font-weight="bold" text-anchor="middle">[AI-4] Tạo hồ sơ</text>
  <text x="787" y="158" font-size="9.5" text-anchor="middle">đăng ký sơ bộ,</text>
  <text x="787" y="172" font-size="9.5" text-anchor="middle">đẩy sang CRM/BSS</text>

  <!-- ===== KINH DOANH LANE ===== -->
  <!-- Task: kiểm tra ngoại lệ -->
  <rect x="720" y="250" width="135" height="52" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5" rx="6"/>
  <text x="787" y="269" font-size="10" font-weight="bold" text-anchor="middle">NV kinh doanh</text>
  <text x="787" y="283" font-size="10" text-anchor="middle">kiểm tra hồ sơ,</text>
  <text x="787" y="296" font-size="10" text-anchor="middle">xử lý ngoại lệ</text>

  <!-- Gateway hồ sơ hợp lệ? -->
  <polygon points="905,276 935,246 965,276 935,306" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
  <text x="935" y="279" font-size="9" text-anchor="middle">Hợp lệ?</text>

  <!-- Task: phát hành work order -->
  <rect x="1010" y="250" width="135" height="52" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5" rx="6"/>
  <text x="1077" y="269" font-size="10" font-weight="bold" text-anchor="middle">Phát hành phiếu</text>
  <text x="1077" y="283" font-size="10" text-anchor="middle">work order tới</text>
  <text x="1077" y="296" font-size="10" text-anchor="middle">kỹ thuật</text>

  <!-- back to chatbot if not valid -->
  <text x="905" y="235" font-size="8.5" fill="#DC2626" font-style="italic">Thiếu/sai → bot hỏi lại KH</text>

  <!-- ===== KỸ THUẬT LANE (giữ nguyên As-is) ===== -->
  <rect x="1010" y="375" width="135" height="52" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 2" rx="6"/>
  <text x="1077" y="394" font-size="10" font-weight="bold" text-anchor="middle">Khảo sát &amp; lắp đặt</text>
  <text x="1077" y="408" font-size="9" text-anchor="middle">(như As-is - Câu 3,</text>
  <text x="1077" y="421" font-size="9" text-anchor="middle">bước 8 đến 11)</text>

  <!-- ===== BILLING LANE (giữ nguyên As-is) ===== -->
  <rect x="1010" y="505" width="135" height="52" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 2" rx="6"/>
  <text x="1077" y="524" font-size="10" font-weight="bold" text-anchor="middle">Nghiệm thu, mở</text>
  <text x="1077" y="538" font-size="9" text-anchor="middle">cước, xuất hóa đơn</text>
  <text x="1077" y="551" font-size="9" text-anchor="middle">(như As-is - bước 12)</text>

  <circle cx="1340" cy="531" r="17" fill="#FFFFFF" stroke="#DC2626" stroke-width="4"/>
  <text x="1340" y="568" font-size="10" text-anchor="middle">Kết thúc</text>

  <!-- ============= FLOWS ============= -->
  <!-- KH start -->
  <line x1="147" y1="725" x2="175" y2="725" stroke="#1F2937" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- KH chat -> bot (msg) -->
  <line x1="237" y1="700" x2="237" y2="177" stroke="#7030A0" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#msg)"/>

  <!-- bot internal -->
  <line x1="147" y1="150" x2="175" y2="150" stroke="#1F2937" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="310" y1="150" x2="335" y2="150" stroke="#1F2937" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="470" y1="150" x2="560" y2="150" stroke="#1F2937" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="695" y1="150" x2="720" y2="150" stroke="#1F2937" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- RAG tu van -> KH xem goi (msg both ways, simplified) -->
  <text x="345" y="195" font-size="8.5" fill="#7030A0">gợi ý gói cước</text>

  <!-- KH chup CCCD -> AI-3 (msg) -->
  <line x1="622" y1="700" x2="622" y2="177" stroke="#7030A0" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#msg)"/>

  <!-- AI-4 -> KD kiem tra -->
  <line x1="787" y1="177" x2="787" y2="250" stroke="#1F2937" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- KD -> gateway -->
  <line x1="855" y1="276" x2="905" y2="276" stroke="#1F2937" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- gateway no -> back to bot -->
  <line x1="935" y1="246" x2="935" y2="205" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="935" y1="205" x2="402" y2="205" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="402" y1="205" x2="402" y2="177" stroke="#DC2626" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- gateway yes -> work order -->
  <line x1="965" y1="276" x2="1010" y2="276" stroke="#059669" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="972" y="269" font-size="9" fill="#059669">Có</text>

  <!-- eSign: KD -> KH -->
  <line x1="1077" y1="302" x2="1077" y2="700" stroke="#7030A0" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#msg)"/>
  <text x="1085" y="450" font-size="8.5" fill="#7030A0">gửi eContract</text>

  <!-- work order -> ky thuat -->
  <line x1="1077" y1="302" x2="1077" y2="375" stroke="#1F2937" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- ky thuat -> billing -->
  <line x1="1077" y1="427" x2="1077" y2="505" stroke="#1F2937" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- billing -> end -->
  <line x1="1145" y1="531" x2="1323" y2="531" stroke="#1F2937" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Legend -->
  <rect x="60" y="850" width="14" height="14" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
  <text x="80" y="862" font-size="11">Task cải tiến bằng GenAI / OCR / eKYC (trong phạm vi bài)</text>

  <rect x="520" y="850" width="14" height="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
  <text x="540" y="862" font-size="11">Task thủ công của nhân viên (kiểm tra ngoại lệ)</text>

  <rect x="940" y="850" width="14" height="14" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="960" y="862" font-size="11">Khâu giữ nguyên như As-is (chưa thay đổi)</text>

  <text x="60" y="895" font-size="10.5" fill="#6B7280" font-style="italic">Ghi chú: ML dự đoán khả thi, tối ưu lịch KTV (VRP), RPA cấu hình OSS và RPA mở cước được xếp vào "hướng phát triển sau" (mục 5.5), không nằm trong phạm vi đề xuất chính.</text>
</svg>
